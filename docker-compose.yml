version: "3.5"

networks:
  default:
    name: universal-resolver

services:
  kilt-did-driver:
    image: kiltprotocol/kilt-did-driver:2.2.0
    environment:
      KILT_BLOCKCHAIN_NODE: ${uniresolver_driver_kilt_blockchain_node}
    ports:
      - "8080:8080"
    expose:
      - 8080
  universal-resolver-frontend:
    image: universalresolver/uni-resolver-frontend:latest
    environment:
      BACKEND_URL: http://127.0.0.1:8080
    ports:
      - "7081:80"
    depends_on:
      - kilt-did-driver
